<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>login</title>
<style>:root{color-scheme:dark;--ink:#ece5d8;--surface:#23201c;--canvas:#1a1815;--me:#d9906f;--chamisa:#dcb352}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);font:15px system-ui}
.card{position:relative;z-index:1;width:min(360px,90vw);padding:32px;border-radius:18px;background:color-mix(in oklab,var(--surface) 90%,transparent);border:1px solid #353029}
input{width:100%;box-sizing:border-box;margin:8px 0 14px;padding:10px;border-radius:10px;border:1px solid #353029;background:#1a1815;color:inherit}
button{width:100%;padding:11px;border-radius:999px;border:0;background:var(--me);color:#1a1815;font:inherit}</style></head>
<body><div class="card"><h2 style="margin:0 0 18px;font-weight:500">/coody</h2>email<input>password<input type="password"><button>sign in</button></div>
<script type="module" src="./dist/login.js"></script></body></html>
